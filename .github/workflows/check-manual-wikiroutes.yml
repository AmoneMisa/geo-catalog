name: Check manual WikiRoutes crawler

on:
  push:
    branches:
      - feat/ua-city-districts-cherkasy-poltava-chernihiv
    paths:
      - '.github/workflows/check-manual-wikiroutes.yml'
      - 'scripts/refresh-tashkent-wikiroutes.js'

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/refresh-tashkent-wikiroutes.js
      - run: node scripts/refresh-tashkent-wikiroutes.js --output=.cache/wikiroutes/tashkent-active.json --concurrency=8 --timeout=15000
      - name: Inspect reconciliation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('.cache/wikiroutes/tashkent-active.json', 'utf8'));
          const gaps = data.routesNotInCatalog ?? [];
          const gapCounts = gaps.reduce((out, row) => {
            const key = `${row.mode}:${row.scope ?? 'unknown'}`;
            out[key] = (out[key] ?? 0) + 1;
            return out;
          }, {});
          console.log('RECONCILIATION', JSON.stringify({
            routeCount: data.routeCount,
            stopCount: data.stopCount,
            routeErrorCount: data.routeErrorCount,
            routeParseMissCount: data.routeParseMissCount,
            stopMissingCoordinateCount: data.stopMissingCoordinateCount,
            catalogComparison: data.catalogComparison,
            gapCounts,
            firstRoutesNotInCatalog: gaps.slice(0, 80),
            firstStopsNotInCatalog: (data.stopsNotInCatalog ?? []).slice(0, 30),
          }, null, 2));
          NODE
