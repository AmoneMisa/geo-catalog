name: Publish package

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'release: trigger geo-catalog 0.6.0 publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm install
      - run: npm test
      - run: npm run validate
      - run: npm run audit:lexicon
      - run: npm publish --access public
