name: Finish WikiRoutes integration

on:
  push:
    branches: [data/wikiroutes-routes]
    paths:
      - .github/workflows/finish-wikiroutes-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/wikiroutes-routes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire WikiRoutes into canonical transport catalog
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const catalogPath = 'src/transport/catalog.js';
          let catalog = fs.readFileSync(catalogPath, 'utf8');

          const importNeedle = `import {\n  TASHKENT_MINIBUS_ROUTES,\n  TASHKENT_MINIBUS_ROUTE_VARIANTS,\n  TASHKENT_MINIBUS_STOPS,\n} from './tashkent-minibus.js';`;
          const importReplacement = `${importNeedle}\nimport {\n  WIKIROUTES_ROUTES,\n  WIKIROUTES_ROUTE_VARIANTS,\n  WIKIROUTES_STOPS,\n} from './wikiroutes.js';`;
          if (!catalog.includes(importNeedle)) throw new Error('catalog import insertion point changed');
          catalog = catalog.replace(importNeedle, importReplacement);

          const stopsNeedle = `  ...TASHKENT_MINIBUS_STOPS,\n]);`;
          if (!catalog.includes(stopsNeedle)) throw new Error('transport stop aggregation insertion point changed');
          catalog = catalog.replace(stopsNeedle, `  ...TASHKENT_MINIBUS_STOPS,\n  ...WIKIROUTES_STOPS,\n]);`);

          const routesNeedle = `  ...TASHKENT_MINIBUS_ROUTES,\n]);`;
          if (!catalog.includes(routesNeedle)) throw new Error('transport route aggregation insertion point changed');
          catalog = catalog.replace(routesNeedle, `  ...TASHKENT_MINIBUS_ROUTES,\n  ...WIKIROUTES_ROUTES,\n]);`);

          const variantsNeedle = `  ...TASHKENT_MINIBUS_ROUTE_VARIANTS,\n]);`;
          if (!catalog.includes(variantsNeedle)) throw new Error('transport variant aggregation insertion point changed');
          catalog = catalog.replace(variantsNeedle, `  ...TASHKENT_MINIBUS_ROUTE_VARIANTS,\n  ...WIKIROUTES_ROUTE_VARIANTS,\n]);`);

          fs.writeFileSync(catalogPath, catalog);
          NODE

          cat > test/wikiroutes-transport.test.js <<'TEST'
          import test from 'node:test';
          import assert from 'node:assert/strict';

          import {
            TRANSPORT_ROUTES,
            TRANSPORT_ROUTE_VARIANTS,
            TRANSPORT_STOPS,
            findTransportRoutes,
            getTransportRoute,
            getTransportStop,
            validateTransportCatalog,
          } from '../src/transport/catalog.js';

          test('WikiRoutes bulk import exposes full local-transit topology for canonical cities', () => {
            const wikiRoutes = TRANSPORT_ROUTES.filter((route) => route.source === 'wikiroutes');
            const wikiStops = TRANSPORT_STOPS.filter((stop) => stop.source === 'wikiroutes');
            const wikiVariants = TRANSPORT_ROUTE_VARIANTS.filter((variant) => variant.source === 'wikiroutes');
            const cityIds = new Set(wikiRoutes.map((route) => route.cityId));

            assert.ok(wikiRoutes.length >= 3_000, `expected >=3000 WikiRoutes routes, got ${wikiRoutes.length}`);
            assert.ok(wikiStops.length >= 45_000, `expected >=45000 WikiRoutes stops, got ${wikiStops.length}`);
            assert.ok(wikiVariants.length >= 6_000, `expected >=6000 WikiRoutes variants, got ${wikiVariants.length}`);
            assert.ok(cityIds.size >= 45, `expected >=45 WikiRoutes cities, got ${cityIds.size}`);

            assert.ok(findTransportRoutes({ country: 'RO', cityId: 'ro:bucharest' }).some((route) => route.source === 'wikiroutes'));
            assert.ok(findTransportRoutes({ country: 'UA', cityId: 'ua:kyiv' }).some((route) => route.source === 'wikiroutes'));
            assert.ok(findTransportRoutes({ country: 'UZ', cityId: 'uz:samarkand' }).some((route) => route.source === 'wikiroutes'));
            assert.ok(findTransportRoutes({ country: 'KZ', cityId: 'kz:almaty' }).some((route) => route.source === 'wikiroutes'));
            assert.ok(findTransportRoutes({ country: 'KG', cityId: 'kg:bishkek' }).some((route) => route.source === 'wikiroutes'));
            assert.equal(findTransportRoutes({ cityId: 'uz:tashkent' }).some((route) => route.source === 'wikiroutes'), false);
          });

          test('WikiRoutes coordinate mask is decoded before data enters the catalog', () => {
            const stop = getTransportStop('ro:bucharest:stop:bus:wikiroutes:1487092');
            assert.ok(stop);
            assert.deepEqual(stop.center, { lat: 44.416578, lng: 26.112582 });

            const route = getTransportRoute('ro:bucharest:route:bus:wikiroutes:46809');
            assert.ok(route);
            assert.equal(route.ref, '323');
            assert.equal(route.coverage, 'full');
            assert.ok(route.variants.length >= 2);

            for (const variant of route.variants) {
              assert.ok(variant.stopIds.length >= 2);
              assert.equal(variant.geometry.type, 'MultiLineString');
              assert.ok(variant.geometry.coordinates[0].length >= 2);
            }
          });

          test('WikiRoutes expansion keeps the transport catalog valid', () => {
            const result = validateTransportCatalog();
            assert.equal(result.valid, true, result.errors.slice(0, 20).join('\n'));
          });
          TEST

          rm -f .github/workflows/generate-wikiroutes-import.yml
          rm -f .github/workflows/finish-wikiroutes-integration.yml
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run validate
      - run: npm run audit:lexicon
      - run: npm run audit:transport
      - run: npm pack --dry-run
      - name: Commit completed integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate WikiRoutes transport catalog"
          git push origin HEAD:data/wikiroutes-routes
