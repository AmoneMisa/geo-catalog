name: Apply Tashkent area sync

on:
  push:
    branches:
      - data/tashkent-local-areas-2026-08-30

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch verified Tashkent areas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:100]}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          areas = Path('src/data/uz/tashkent/local-areas-verified.js')
          replace_once(
              areas,
              "  osmArea('parkent-riyoziy', 'Parkent-Riyoziy', 'uz:tashkent:yashnobod', 41.31217, 69.32614, 'node', 1867099585, 650),",
              "  osmArea('parkent-riyoziy', 'Parkent-Riyoziy', 'uz:tashkent:yashnobod', 41.31217, 69.32614, 'node', 1867099585, 650),\n  // Official Parkent-Siolkovskiy mavzesi in Do'stobod; center from the current house-2/Oltintepa address cluster.\n  derivedArea('parkent-siolkovskiy', 'Parkent-Siolkovskiy', 'uz:tashkent:yashnobod', 41.312243, 69.331072, 650),",
          )
          replace_once(
              areas,
              "  derivedArea('beruniy-b1', 'Beruniy-B1', 'uz:tashkent:almazar', 41.3324073, 69.2230774, 750),",
              "  derivedArea('beruniy-b1', 'Beruniy-B1', 'uz:tashkent:almazar', 41.3324073, 69.2230774, 750),\n  // Official Beruniy-B3 dahasi in Quyosh mahalla matches the OSM Beruniy-3 neighbourhood locality.\n  osmArea('beruniy-b3', 'Beruniy-B3', 'uz:tashkent:almazar', 41.33791, 69.21631, 'node', 1866097646, 700),",
          )

          gaps = Path('src/coverage-gaps.js')
          replace_once(
              gaps,
              "    'Manzara','Takhtapul','Taxtapul','Suvsoz-3','Suvsoz-4','Suvsoz-5','Parkent-Siolkovskiy','Minora','Muxbir','Shimoliy Olmazor-1','Shimoliy Olmazor-2','Taraqqiyot-4','Shifokorlar-2','Shifokorlar-3','Shifokorlar-5','Shifokorlar-6','Beruniy-B3',\"So'lim\", \"Sug'diyona\",",
              "    'Manzara','Takhtapul','Taxtapul','Suvsoz-3','Suvsoz-4','Suvsoz-5','Minora','Muxbir','Shimoliy Olmazor-1','Shimoliy Olmazor-2','Taraqqiyot-4','Shifokorlar-2','Shifokorlar-3','Shifokorlar-5','Shifokorlar-6',\"So'lim\", \"Sug'diyona\",",
          )

          tests = Path('test/tashkent-local-area-coverage.test.js')
          replace_once(
              tests,
              "  ['Parkent-Riyoziy', 'uz:tashkent:local-area:parkent-riyoziy', 'uz:tashkent:yashnobod', 'node', 1867099585],",
              "  ['Parkent-Riyoziy', 'uz:tashkent:local-area:parkent-riyoziy', 'uz:tashkent:yashnobod', 'node', 1867099585],\n  ['Beruniy-B3', 'uz:tashkent:local-area:beruniy-b3', 'uz:tashkent:almazar', 'node', 1866097646],",
          )
          replace_once(
              tests,
              "  ['Guruchariq', 'uz:tashkent:local-area:guruchariq', 'uz:tashkent:almazar', 41.3471392, 69.2398304],",
              "  ['Guruchariq', 'uz:tashkent:local-area:guruchariq', 'uz:tashkent:almazar', 41.3471392, 69.2398304],\n  ['Parkent-Siolkovskiy', 'uz:tashkent:local-area:parkent-siolkovskiy', 'uz:tashkent:yashnobod', 41.312243, 69.331072],",
          )
          PY
      - name: Install
        run: npm install --ignore-scripts
      - name: Test
        run: npm test
      - name: Validate
        run: npm run validate
      - name: Audit lexicon
        run: npm run audit:lexicon
      - name: Pack check
        run: npm pack --dry-run
      - name: Commit area sync
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/uz/tashkent/local-areas-verified.js src/coverage-gaps.js test/tashkent-local-area-coverage.test.js
          if git diff --cached --quiet; then
            echo 'No area changes to commit.'
            exit 0
          fi
          git commit -m 'data: resolve Parkent-Siolkovskiy and Beruniy-B3'
          git push origin "HEAD:${GITHUB_REF_NAME}"
