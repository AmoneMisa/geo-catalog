name: Apply verified Tashkent local-area batch

on:
  push:
    branches:
      - data/tashkent-local-areas-2026-08-30
    paths:
      - .github/workflows/apply-tashkent-local-area-batch.yml

permissions:
  contents: write

concurrency:
  group: apply-tashkent-local-area-batch
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/tashkent-local-areas-2026-08-30
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified local-area batch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:120]}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          areas = Path('src/data/uz/tashkent/local-areas-verified.js')
          replace_once(
              areas,
              "  boundaryArea('shimoliy-olmazor', 'Shimoliy Olmazor', 'uz:tashkent:almazar', 450),\n  osmArea('suvsoz-1', 'Suvsoz-1', 'uz:tashkent:bektemir', 41.247201, 69.3706561, 'relation', 19801804, 700),",
              "  boundaryArea('shimoliy-olmazor', 'Shimoliy Olmazor', 'uz:tashkent:almazar', 450),\n  // Official Miskin-MFY addresses identify Shimoliy Olmazor-2 as a standalone mavze; center from the current residential cluster.\n  derivedArea('shimoliy-olmazor-2', 'Shimoliy Olmazor-2', 'uz:tashkent:almazar', 41.351744, 69.255455, 800),\n  osmArea('suvsoz-1', 'Suvsoz-1', 'uz:tashkent:bektemir', 41.247201, 69.3706561, 'relation', 19801804, 700),",
          )
          replace_once(
              areas,
              "  osmArea('suvsoz-2', 'Suvsoz-2', 'uz:tashkent:bektemir', 41.2518266, 69.3756741, 'way', 153528330, 650),\n  // Representative center from multiple current Suvsoz-4 mavzesi address anchors; no standalone OSM owner is asserted.",
              "  osmArea('suvsoz-2', 'Suvsoz-2', 'uz:tashkent:bektemir', 41.2518266, 69.3756741, 'way', 153528330, 650),\n  // City Council defines Suvsoz-3 between Rohat, Yettisuv, Choyxona and Bandixon; center is an approximate centroid of verified boundary-adjacent anchors.\n  derivedArea('suvsoz-3', 'Suvsoz-3', 'uz:tashkent:bektemir', 41.244307, 69.36724, 1100),\n  // Representative center from multiple current Suvsoz-4 mavzesi address anchors; no standalone OSM owner is asserted.",
          )

          gaps = Path('src/coverage-gaps.js')
          replace_once(
              gaps,
              "    'Manzara','Takhtapul','Taxtapul','Suvsoz-3','Suvsoz-5','Minora','Muxbir','Shimoliy Olmazor-1','Shimoliy Olmazor-2','Taraqqiyot-4','Shifokorlar-2','Shifokorlar-3','Shifokorlar-5','Shifokorlar-6',\"So'lim\", \"Sug'diyona\",",
              "    'Manzara','Takhtapul','Taxtapul','Suvsoz-5','Minora','Muxbir','Shimoliy Olmazor-1','Taraqqiyot-4','Shifokorlar-2','Shifokorlar-3','Shifokorlar-5','Shifokorlar-6',\"So'lim\", \"Sug'diyona\",",
          )

          coverage_test = Path('test/tashkent-local-area-coverage.test.js')
          replace_once(
              coverage_test,
              "  ['Guruchariq', 'uz:tashkent:local-area:guruchariq', 'uz:tashkent:almazar', 41.3471392, 69.2398304],\n  ['Suvsoz-4', 'uz:tashkent:local-area:suvsoz-4', 'uz:tashkent:bektemir', 41.253458, 69.376753],",
              "  ['Guruchariq', 'uz:tashkent:local-area:guruchariq', 'uz:tashkent:almazar', 41.3471392, 69.2398304],\n  ['Shimoliy Olmazor-2', 'uz:tashkent:local-area:shimoliy-olmazor-2', 'uz:tashkent:almazar', 41.351744, 69.255455],\n  ['Suvsoz-3', 'uz:tashkent:local-area:suvsoz-3', 'uz:tashkent:bektemir', 41.244307, 69.36724],\n  ['Suvsoz-4', 'uz:tashkent:local-area:suvsoz-4', 'uz:tashkent:bektemir', 41.253458, 69.376753],",
          )

          semantics = Path('test/tashkent-semantics.test.js')
          replace_once(
              semantics,
              "  assert.equal(isGeoCoverageGap({ country: 'UZ', city: 'Tashkent', type: 'local_area', canonical: 'Suvsoz-3' }), true);",
              "  assert.equal(isGeoCoverageGap({ country: 'UZ', city: 'Tashkent', type: 'local_area', canonical: 'Suvsoz-3' }), false);\n  assert.equal(isGeoCoverageGap({ country: 'UZ', city: 'Tashkent', type: 'local_area', canonical: 'Suvsoz-5' }), true);",
          )
          PY
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run validate
      - run: npm run audit:lexicon
      - run: npm pack --dry-run
      - name: Commit verified batch
        shell: bash
        run: |
          rm .github/workflows/apply-tashkent-local-area-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: resolve two Tashkent local-area gaps"
          git pull --rebase origin data/tashkent-local-areas-2026-08-30
          git push origin HEAD:data/tashkent-local-areas-2026-08-30
