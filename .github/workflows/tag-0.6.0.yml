name: Tag geo-catalog 0.6.0

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/tag-0.6.0.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - name: Remove one-time tag workflow and create release tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tag-0.6.0.yml
          git add .github/workflows/tag-0.6.0.yml
          git commit -m 'chore: clean up 0.6.0 tag workflow'
          git push origin HEAD:master
          git tag -a v0.6.0 -m 'geo-catalog v0.6.0'
          git push origin v0.6.0
