name: Verify feature branch

on:
  push:
    branches:
      - feat/ua-city-districts-cherkasy-poltava-chernihiv
    paths:
      - '.github/workflows/verify-feature-branch.yml'
      - 'package.json'
      - 'transport.d.ts'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run validate
      - run: npm run audit:lexicon
      - run: npm run audit:transport
      - run: npm pack --dry-run
