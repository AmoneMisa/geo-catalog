name: Verify feature transport

on:
  push:
    branches:
      - feat/ua-city-districts-cherkasy-poltava-chernihiv
    paths:
      - '.github/workflows/verify-feature-branch.yml'
      - 'package.json'
      - 'transport.d.ts'
      - 'src/transport/**'
      - 'test/transport-*.test.js'
      - 'test/tashkent-transport-map.test.js'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --ignore-scripts
      - name: Transport tests
        run: node --test test/transport-catalog.test.js test/transport-nearest.test.js test/tashkent-transport-map.test.js
      - name: Validate catalog
        run: npm run validate
      - name: Audit transport coverage
        run: npm run audit:transport
      - name: Confirm current Tashkent modes are active-only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { TRANSPORT_ROUTES } from './src/transport/catalog.js';
          const routes = TRANSPORT_ROUTES.filter((route) => route.cityId === 'uz:tashkent');
          const counts = routes.reduce((result, route) => {
            result[route.mode] = (result[route.mode] ?? 0) + 1;
            return result;
          }, {});
          console.log(counts);
          for (const mode of ['tram', 'trolleybus', 'funicular']) {
            if (routes.some((route) => route.mode === mode)) {
              throw new Error(`Unexpected inactive/historical ${mode} route in current Tashkent catalog`);
            }
          }
          NODE
      - name: Check package contents without lifecycle scripts
        run: npm pack --dry-run --ignore-scripts
