name: Refresh Tashkent bus WikiRoutes snapshot

on:
  workflow_dispatch:
  push:
    branches-ignore: [master, main]
    paths:
      - '.github/workflows/refresh-tashkent-bus-wikiroutes.yml'
      - 'scripts/refresh-tashkent-bus-wikiroutes.js'
      - 'test/wikiroutes-crawler.test.js'

permissions:
  contents: write

concurrency:
  group: tashkent-bus-wikiroutes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Refuse protected branches
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            master|main)
              echo "Refusing to refresh generated WikiRoutes data directly on ${GITHUB_REF_NAME}."
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Verify WikiRoutes parser fixtures
        run: node --test test/wikiroutes-crawler.test.js
      - name: Probe raw WikiRoutes catalog boundaries
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {
            CATALOG_URL,
            normalizeRouteRef,
            parseCatalogRoutes,
            parseRoutePage,
          } from './scripts/refresh-tashkent-bus-wikiroutes.js';

          const fetchHtml = async (url) => {
            const response = await fetch(url, {
              headers: { 'user-agent': 'geo-catalog WikiRoutes markup probe' },
              signal: AbortSignal.timeout(12000),
            });
            if (!response.ok) throw new Error(`${response.status} ${response.statusText} for ${url}`);
            return response.text();
          };
          const compact = (value) => value.replace(/\s+/g, ' ').replace(/>\s+</g, '><').trim();
          const snippetsFor = (html, pattern, radius = 450) => [...html.matchAll(pattern)].slice(0, 8).map((match) => {
            const index = match.index ?? 0;
            return compact(html.slice(Math.max(0, index - radius), Math.min(html.length, index + match[0].length + radius)));
          });

          const catalogHtml = await fetchHtml(CATALOG_URL);
          const rawRouteAnchors = [...catalogHtml.matchAll(/<a\b[^>]*href=["']([^"']*\/tashkent\?[^"']*routes=\d+[^"']*)["'][^>]*>[\s\S]*?<\/a>/gi)];
          console.log(JSON.stringify({
            bytes: catalogHtml.length,
            busLabelSnippets: snippetsFor(catalogHtml, /Автобусы/gi),
            minibusLabelSnippets: snippetsFor(catalogHtml, /Маршрутки/gi),
            firstRawRouteAnchors: rawRouteAnchors.slice(0, 8).map((match) => compact(match[0]).slice(0, 500)),
            route10600Snippets: snippetsFor(catalogHtml, /routes=10600/gi),
          }, null, 2));

          const routes = parseCatalogRoutes(catalogHtml);
          const uniqueRefs = new Set(routes.map((route) => normalizeRouteRef(route.ref)));
          console.log(JSON.stringify({
            parsedCatalogRouteCount: routes.length,
            uniqueRouteRefCount: uniqueRefs.size,
            firstRoutes: routes.slice(0, 10).map(({ sourceRouteId, ref, sourceRouteUrl }) => ({ sourceRouteId, ref, sourceRouteUrl })),
            lastRoutes: routes.slice(-10).map(({ sourceRouteId, ref, sourceRouteUrl }) => ({ sourceRouteId, ref, sourceRouteUrl })),
          }, null, 2));

          const route = routes[0];
          if (route) {
            const routeHtml = await fetchHtml(route.sourceRouteUrl);
            const parsed = parseRoutePage(routeHtml, route);
            console.log(JSON.stringify({
              probeRoute: { sourceRouteId: route.sourceRouteId, ref: route.ref, sourceRouteUrl: route.sourceRouteUrl },
              rawStopLinks: [...routeHtml.matchAll(/href=["']([^"']*\/stops\/\d+[^"']*)["']/gi)].length,
              parsedDirections: parsed.directions.map((direction) => ({
                name: direction.name,
                stopCount: direction.stops.length,
                firstStop: direction.stops[0]?.name,
                lastStop: direction.stops.at(-1)?.name,
              })),
            }, null, 2));
          }
          NODE
      - name: Crawl current WikiRoutes Tashkent bus catalog
        run: npm run crawl:wikiroutes
      - name: Validate refreshed transport snapshot
        run: |
          npm test
          npm run validate
          npm run audit:transport
          npm pack --dry-run
      - name: Commit WikiRoutes snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/transport/generated/tashkent-bus-wikiroutes-snapshot.js
          if git diff --cached --quiet; then
            echo "No WikiRoutes snapshot changes"
            exit 0
          fi
          git commit -m "data: refresh Tashkent bus WikiRoutes snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
