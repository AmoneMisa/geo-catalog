name: Check enrichment matcher regressions

on:
  push:
    branches:
      - feat/ua-city-districts-cherkasy-poltava-chernihiv
    paths:
      - '.github/workflows/check-enrichment-regressions.yml'
      - 'scripts/geo-enrichment-match.js'
      - 'test/geo-enrichment-match-regressions.test.js'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node --test test/geo-enrichment-match-regressions.test.js
      - run: npm test
      - run: npm run validate
