name: Release geo-catalog 0.6.0

on:
  push:
    branches:
      - master
    paths:
      - package.json

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install
      - run: npm test
      - run: npm run validate
      - run: npm run audit:lexicon
      - run: npm publish --access public
      - name: Remove one-time release workflow
        run: |
          rm .github/workflows/release-0.6.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release-0.6.0.yml
          git commit -m 'chore: clean up 0.6.0 release workflow'
          git push origin HEAD:master
